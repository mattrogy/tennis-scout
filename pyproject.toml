[project]
name = "tennis-scout"
version = "0.1.0"
description = "Scouting assistant for tennis coaches: sourced opponent stats through an MCP server"
readme = "README.md"
authors = [
    { name = "Matthieu Rogy", email = "330372403+mattrogy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "mcp>=2.3.0",
    "openai>=3.36.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # lets tests "import build_db" to build a tiny test database

# Vercel: during each deploy, download the pinned data and build data/tennis.db (both git-ignored),
# so the database is never in the repository. The website app itself is found in app.py.
[tool.vercel.scripts]
build = "PYTHONPATH=src python scripts/download_data.py && PYTHONPATH=src python scripts/build_db.py"
